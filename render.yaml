{
  "services": [
    {
      "type": "web",
      "name": "proposalq-beta",
      "runtime": "docker",
      "plan": "free",
      "region": "frankfurt",
      "branch": "codex/p0-private-beta-deploy",
      "autoDeployTrigger": "off",
      "dockerfilePath": "./Dockerfile",
      "dockerContext": ".",
      "healthCheckPath": "/health/live/",
      "maxShutdownDelaySeconds": 150,
      "envVars": [
        {"key": "APP_ENV", "value": "production"},
        {"key": "DEBUG", "value": "False"},
        {"key": "AI_ENABLED", "value": "False"},
        {"key": "REGISTRATION_ENABLED", "value": "False"},
        {"key": "PORT", "value": "10000"},
        {"key": "WEB_CONCURRENCY", "value": "2"},
        {"key": "PYTHON_DOTENV_DISABLED", "value": "1"},
        {"key": "SECURE_SSL_REDIRECT", "value": "True"},
        {"key": "SECURE_HSTS_SECONDS", "value": "300"},
        {"key": "SECURE_HSTS_INCLUDE_SUBDOMAINS", "value": "False"},
        {"key": "SECURE_HSTS_PRELOAD", "value": "False"},
        {"key": "TRUST_PROXY_HEADERS", "value": "True"},
        {"key": "CSRF_TRUSTED_ORIGINS", "value": ""},
        {"key": "SECRET_KEY", "sync": false},
        {"key": "DATABASE_URL", "sync": false}
      ]
    }
  ]
}
