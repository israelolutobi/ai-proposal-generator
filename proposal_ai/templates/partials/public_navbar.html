{% load static %}

<header class="pq-public-navbar">
    <div class="pq-public-navbar-inner">

        <a href="/" class="pq-public-brand" aria-label="ProposalQ home">
            <img
                src="{% static 'images/proposallogo.png' %}"
                alt=""
                width="48"
                height="48"
            >
            <span class="pq-public-brand-name">
                Proposal<span>Q</span>
            </span>
        </a>

        <nav class="pq-public-desktop-nav" aria-label="Main navigation">
            <a href="/">Home</a>
            <a href="{% url 'pricing' %}">Pricing</a>
            <a href="/login/">Login</a>

            {% if registration_enabled %}
            <a class="pq-public-register" href="{% url 'register' %}">
                Register
            </a>
            {% endif %}
        </nav>

        <details class="pq-public-mobile-menu">
            <summary aria-label="Toggle navigation menu">
                <span class="pq-public-menu-label">Menu</span>
                <span class="pq-public-menu-icon" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </summary>

            <nav aria-label="Mobile navigation">
                <a href="/">Home</a>
                <a href="{% url 'pricing' %}">Pricing</a>
                <a href="/login/">Login</a>

                {% if registration_enabled %}
                <a class="pq-public-register" href="{% url 'register' %}">
                    Register
                </a>
                {% endif %}
            </nav>
        </details>

    </div>
</header>
