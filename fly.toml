# No app/account is selected here. Pass --app after owner authorization.
# Deploy with --flycast and VERIFY there are NO public IP addresses beforehand.
# Private Flycast is HTTP; the owner-facing TLS/VPN gateway is a release gate.
kill_signal = "SIGTERM"
kill_timeout = 150

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "python scripts/release.py"
  strategy = "rolling"

[env]
  APP_ENV = "production"
  DEBUG = "False"
  AI_ENABLED = "False"
  REGISTRATION_ENABLED = "False"
  PYTHON_DOTENV_DISABLED = "1"
  PORT = "8000"
  WEB_CONCURRENCY = "2"
  SECURE_SSL_REDIRECT = "True"
  SECURE_HSTS_SECONDS = "300"
  SECURE_HSTS_INCLUDE_SUBDOMAINS = "False"
  SECURE_HSTS_PRELOAD = "False"
  TRUST_PROXY_HEADERS = "True"
  # Add the approved HTTPS gateway host in provider configuration before use.
  ALLOWED_HOSTS = "proposalq-private-beta.internal"
  CSRF_TRUSTED_ORIGINS = ""

[http_service]
  internal_port = 8000
  # Flycast's internal HTTP must not redirect at the platform layer.
  # Django's HTTPS policy remains enabled behind the verified TLS gateway.
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.http_options]
    idle_timeout = 150

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health/ready/"
    protocol = "http"
    [http_service.checks.headers]
      Host = "proposalq-private-beta.internal"
      X-Forwarded-Proto = "https"

[checks.liveness]
  type = "http"
  port = 8000
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/health/live/"
  [checks.liveness.headers]
    Host = "proposalq-private-beta.internal"
    X-Forwarded-Proto = "https"
